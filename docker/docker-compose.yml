version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deya_web
    command: >
      /bin/sh -c "python manage.py migrate --noinput &&
                  python manage.py collectstatic --noinput &&
                  gunicorn --workers ${WORKERS_COUNT:-4} --reload --bind 0.0.0.0:8000 config.wsgi:application"
    volumes:
      - ./../src:/app/src
      - ./../static:/app/static
      - ./../media:/app/media
      - ./../logs:/app/logs
      - ./../assets:/app/assets
    ports:
      - "8081:8000"
    env_file:
      - ./../.envs/.env
    environment:
      - CELERY_BROKER=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared_network

  postgres:
    image: postgres:17.0
    container_name: deya_db
    env_file:
      - ./../.envs/.env
    volumes:
      - ./.volumes/pgdata:/var/lib/postgresql/data
    ports:
      - "5439:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - shared_network

  redis:
    image: redis:7.2-alpine
    container_name: deya_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - ./.volumes/redis_data:/data
    ports:
      - "6370:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - shared_network

