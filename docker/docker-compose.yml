  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: deya_celery
    networks:
      - shared_network
    command: celery -A config worker --loglevel=INFO --concurrency=${CELERY_WORKERS:-2}
    volumes:
      - ./../src:/app/src
      - ./../media:/app/media
      - ./../logs:/app/logs
    depends_on:
      - redis
    env_file:
      - ./../.envs/.env

  nginx:
    image: nginx:1.27
    networks:
      - shared_network
    ports:
      - "8000:80"
    volumes:
      - ./.conf/docker-nginx.conf:/etc/nginx/nginx.conf
      - ./../static:/app/static
      - ./../media:/app/media

networks:
  shared_network:
    driver: bridge
